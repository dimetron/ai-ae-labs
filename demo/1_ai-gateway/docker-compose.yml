# agentgateway demo — LLM gateway + observability stack.
#
#   docker compose up -d
#   ./smoke-test.sh
#
# Services:
#   agentgateway  the gateway itself (LLM API on :4000, admin UI on :15000, metrics on :15020)
#   mock-llm      tiny OpenAI-compatible mock backend (no API key needed)
#   otel-collector OTLP receiver -> Jaeger (traces) + Prometheus (metrics)
#   jaeger        trace UI
#   prometheus    metrics scraper
#   grafana       dashboards over Prometheus + Jaeger
#
# Optional real backends: copy .env.example to .env and fill in whichever keys
# you have (OpenAI, Anthropic, Gemini, Ollama Cloud) to enable those routes.
# The demo works without any of them — the mock backend is the default target.
#
# Every key is passed through as `${VAR:-}` on purpose. agentgateway shell-
# expands its whole config file at load, and an UNDEFINED variable is a fatal
# startup error; `:-` turns "unset on the host" into "empty in the container",
# which the gateway accepts. That is what keeps the zero-key path working.

services:
  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.4.1
    container_name: agw
    ports:
      - "4000:4000"                  # OpenAI-compatible LLM API
      - "127.0.0.1:15000:15000"      # Admin UI
      - "127.0.0.1:15020:15020"      # Prometheus metrics
    volumes:
      - ./config/agentgateway.yaml:/config.yaml:ro
      - ./config/catalog.json:/costs/catalog.json:ro
    environment:
      ADMIN_ADDR: 0.0.0.0:15000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    command: ["-f", "/config.yaml"]
    depends_on:
      - otel-collector
      - mock-llm

  mock-llm:
    build: ./mock-llm
    container_name: mock-llm
    ports:
      - "127.0.0.1:8080:8080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.146.0
    container_name: otel-collector
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "127.0.0.1:16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./otel/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./otel/grafana-provisioning:/etc/grafana/provisioning:ro
