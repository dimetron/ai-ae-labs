# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  logging:
    fields:
      add:
        llm.prompt: llm.prompt
        llm.completion: llm.completion
  database:
    url: ${AGENTGATEWAY_DATABASE_URL:-postgresql://agentgateway:agentgateway@localhost:5432/agentgateway}
  storage:
    mode: ${AGENTGATEWAY_STORAGE_MODE:-file}
  modelCatalog:
    - file: ${AGENTGATEWAY_BASE_COSTS:-./base-costs.json}
    - file: ${AGENTGATEWAY_PI_ALIASES:-./pi-aliases.json}
    - inline:
        providers: {}
frontendPolicies:
  http:
    maxBufferSize: 20971520
gateways:
  default:
    port: 4000
mcp:
  gateways: default
  prefixMode: always
  targets:
    - name: openai-docs
      mcp:
        host: https://developers.openai.com/mcp
    - name: tavily
      mcp:
        host: mcp.tavily.com
        port: 443
        path: /mcp/?tavilyApiKey=${TAVILY_API_KEY:-}
      policies:
        backendTLS:
          hostname: mcp.tavily.com
    - name: openrouter
      mcp:
        host: https://mcp.openrouter.ai/mcp
ui:
  gateways: default
llm:
  providers:
    - name: anthropic
      provider: anthropic
      params:
        apiKey: ${ANTHROPIC_API_KEY:-}
    - name: openai
      provider: openai
      params:
        apiKey: ${OPENAI_API_KEY:-}
    - name: gemini
      provider:
        custom:
          providerOverride: gcp.gemini
          formats:
            - type: completions
      params:
        baseUrl: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
        apiKey: ${GEMINI_API_KEY:-}
    - name: mistral
      provider: mistral
      params:
        apiKey: ${MISTRAL_API_KEY:-}
    - name: openrouter
      provider: openrouter
      params:
        apiKey: ${OPENROUTER_API_KEY:-}
    - name: xai
      provider: xai
      params:
        apiKey: ${XAI_API_KEY:-}
    - name: ollama
      provider: ollama
      params:
        baseUrl: ${OLLAMA_BASE_URL:-http://localhost:11434/v1}
    - name: prismml
      provider:
        custom:
          formats:
            - type: completions
      params:
        baseUrl: ${PRISMML_BASE_URL:-http://host.docker.internal:11234/v1}
        apiKey: ${PRISMML_API_KEY:-local}
    - name: ollama-cloud
      provider: ollama
      params:
        baseUrl: https://ollama.com/v1
        apiKey: ${OLLAMA_API_KEY:-}
    - name: opencode
      provider:
        custom:
          providerOverride: opencode
          formats:
            - type: completions
            - type: messages
      params:
        baseUrl: ${OPENCODE_BASE_URL:-https://opencode.ai/zen/go/v1}
        apiKey: ${OPENCODE_API_KEY:-}
  models:
    - name: anthropic/*
      provider:
        reference: anthropic
      transformation:
        model: llmRequest.model.stripPrefix("anthropic/")
    - name: openai/*
      provider:
        reference: openai
      transformation:
        model: llmRequest.model.stripPrefix("openai/")
    - name: gemini/*
      provider:
        reference: gemini
      transformation:
        model: llmRequest.model.stripPrefix("gemini/")
    - name: mistral/*
      provider:
        reference: mistral
      transformation:
        model: llmRequest.model.stripPrefix("mistral/")
    - name: openrouter/*
      provider:
        reference: openrouter
      transformation:
        model: llmRequest.model.stripPrefix("openrouter/")
    - name: xai/*
      provider:
        reference: xai
      transformation:
        model: llmRequest.model.stripPrefix("xai/")
    - name: ollama/*
      provider:
        reference: ollama
      transformation:
        model: llmRequest.model.stripPrefix("ollama/")
    - name: prismml/*
      provider:
        reference: prismml
      transformation:
        model: llmRequest.model.stripPrefix("prismml/")
    - name: ollama-cloud/*
      provider:
        reference: ollama-cloud
      transformation:
        model: llmRequest.model.stripPrefix("ollama-cloud/")
    - name: ollama1/*
      provider:
        reference: ollama-cloud
      transformation:
        model: llmRequest.model.stripPrefix("ollama1/")
    - name: opencode/*
      provider:
        reference: opencode
      transformation:
        model: llmRequest.model.stripPrefix("opencode/")
    - name: claude-*
      provider:
        reference: anthropic
    - name: gpt-*
      provider:
        reference: openai
    - name: o3*
      provider:
        reference: openai
    - name: gemini-*
      provider:
        reference: gemini
    - name: grok-*
      provider:
        reference: xai
  virtualModels:
    - name: ollama-deepseek-balanced
      routing:
        weighted:
          targets:
            - model: ollama-cloud/deepseek-v4.1-flash:cloud
              weight: 1
    - name: ollama-gemma4
      routing:
        failover:
          targets:
            - model: ollama-cloud/gemma4:cloud
              priority: 0
    - name: ollama-glm-flash
      routing:
        failover:
          targets:
            - model: ollama-cloud/glm-5.3-flash:cloud
              priority: 0
    - name: ollama-minimax
      routing:
        failover:
          targets:
            - model: ollama-cloud/minimax-m3:cloud
              priority: 0
    - name: ollama-deepseek
      routing:
        failover:
          targets:
            - model: ollama-cloud/deepseek-v4.1-flash:cloud
              priority: 0
    - name: ollama-dsf4
      routing:
        failover:
          targets:
            - model: ollama-cloud/deepseek-v4.1-flash:cloud
              priority: 0
    - name: pi-default
      routing:
        failover:
          targets:
            - model: openai/gpt-5.6-luna
              priority: 1
            - model: gemini/gemini-3.8-flash
              priority: 2
    - name: pi-fast
      routing:
        failover:
          targets:
            - model: ollama-cloud/deepseek-v4.1-flash:cloud
              priority: 0
            - model: openai/gpt-5.6-luna
              priority: 1
  policies:
    apiKey:
      mode: strict
      keys:
        - key: ${AGENTGATEWAY_API_KEY:-agw_sk_CHANGE_ME}
          metadata:
            name: pi-go
            agentgateway.dev/id: 32a5356e-e005-45a1-ade5-d4862546b64c
            agentgateway.dev/createdAt: 1788259453
        - key: agw_sk_x9dru9vISJ852w9ccpV0uNuYJpU2Qgc7
          metadata:
            name: playground
            agentgateway.dev/id: 8c78bde4-4cf3-4d5c-b446-4ec12b465fa2
            agentgateway.dev/createdAt: 1789764186
